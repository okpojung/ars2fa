# ars2fa public entry: https://ars2fa.baro.me via NPM (192.168.94.74) only.
# Public: homepage, developer guide, customer console (+ its API), mobile dial page, customer API (/v1/ars).
# Office only (121.134.237.38): admin console (/admin), admin API (/api/admin), API docs, health.
limit_req_zone $binary_remote_addr zone=ars2fa_public:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ars2fa_login:10m rate=30r/m;
server {
    listen 192.168.94.180:9447 ssl;
    server_name ars2fa.baro.me;
    ssl_certificate /etc/ssl/ars2fa/<file>;
    ssl_certificate_key /etc/ssl/ars2fa/<file>;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 192.168.94.74;
    real_ip_header X-Real-IP;
    if ($realip_remote_addr != 192.168.94.74) { return 403; }
    client_max_body_size 1m;
    access_log /var/log/nginx/ars2fa-public.access.log;
    root /var/www/ars2fa;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    limit_req_status 429;

    location /internal/ { return 404; }

    # ---- office only
    location ^~ /admin { allow 121.134.237.38; deny all; try_files $uri /index.html; }
    location ^~ /api/admin/ {
        allow 121.134.237.38; deny all;
        limit_req zone=ars2fa_login burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 30s;
    }
    location ~ ^/(api-docs|health)(/|$) {
        allow 121.134.237.38; deny all;
        proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https;
    }

    # ---- public
    location = /index.html { add_header Cache-Control "no-store" always; add_header X-Frame-Options DENY always; add_header X-Content-Type-Options nosniff always; }
    location ^~ /assets/ { expires 7d; }
    location ^~ /api/auth/ {
        limit_req zone=ars2fa_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 15s;
    }
    location ^~ /api/ {
        limit_req zone=ars2fa_public burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 30s;
    }
    location ^~ /v1/ars/ {
        limit_req zone=ars2fa_public burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 30s;
    }
    location ~ ^/v1(/|$) { return 404; }
    location / { limit_req zone=ars2fa_public burst=30 nodelay; try_files $uri /index.html; }
}
