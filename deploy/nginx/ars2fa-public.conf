# ars2fa public entry: https://ars2fa.baro.me via NPM (192.168.94.74) only.
# Public: mobile dial page (/m/), its API (/api/public/), customer API (/v1/ars/), static assets.
# Everything else (admin, portal, login, docs) only from the office IP.
limit_req_zone $binary_remote_addr zone=ars2fa_public:10m rate=5r/s;
server {
    listen 192.168.94.180:9447 ssl;
    server_name ars2fa.baro.me;
    ssl_certificate /etc/ssl/ars2fa/<file>;
    ssl_certificate_key /etc/ssl/ars2fa/<file>;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 192.168.94.74;
    real_ip_header X-Real-IP;
    if ($realip_remote_addr != 192.168.94.74) { return 403; }
    client_max_body_size 1m;
    access_log /var/log/nginx/ars2fa-public.access.log;
    root /var/www/ars2fa;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /internal/ { return 404; }
    location ^~ /m/ { limit_req zone=ars2fa_public burst=20 nodelay; try_files $uri /index.html; }
    location = /index.html { add_header Cache-Control "no-store" always; }
    location ^~ /assets/ { expires 7d; }
    location ^~ /api/public/ {
        limit_req zone=ars2fa_public burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }
    location ^~ /v1/ars/ {
        limit_req zone=ars2fa_public burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    # office only
    location ~ ^/(api|api-docs|health)(/|$) {
        allow 121.134.237.38;
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    location / {
        allow 121.134.237.38;
        deny all;
        try_files $uri /index.html;
    }
}
