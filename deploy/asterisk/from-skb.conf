[from-skb]
; ars2fa user-dialed ARS: 0507 -> (CallMix forwarding, switched on per authentication) -> SKB 070 -> here.
; SKB sends R-URI = pilot 07078754442 and To = the dialed 070 (= rn). The caller number arrives only in From
; (CALLERID(num) and P-Asserted-Identity are empty on this trunk). The ars2fa backend decides with the carrier
; AuthLog (which 0507, which caller). __INTERNAL_API_KEY__ is replaced at install time.
; Calls on a resting number arrive on the guard line (CALLMIX_GUARD_RN) where no session waits -> invalid-access message.
exten => s,1,NoOp(ARS2FA in)
 same => n,Set(ARS_T0=${EPOCH})
 same => n,Set(ARS_OKP=custom/ars-auth-ok)
 same => n,Set(ARS_FAILP=custom/ars-auth-fail)
 same => n,Set(ARS_TO=${PJSIP_HEADER(read,To)})
 same => n,Set(ARS_TOH=${CUT(ARS_TO,@,1)})
 same => n,Set(ARS_RN=${FILTER(0-9,${CUT(ARS_TOH,:,2)})})
 same => n,GotoIf($["${ARS_RN}" != ""]?rnok)
 same => n,Set(ARS_RN=${FILTER(0-9,${ARS_DID})})
 same => n(rnok),Log(NOTICE,ARS2FA start uid=${UNIQUEID} rn=${ARS_RN} did=${ARS_DID} to=${ARS_TOH})
 same => n,Set(ARS_CID=${FILTER(0-9+,${CALLERID(num)})})
 same => n,Set(ARS_PAI=${PJSIP_HEADER(read,P-Asserted-Identity)})
 same => n,Set(ARS_X=${CUT(ARS_PAI,@,1)})
 same => n,Set(ARS_PAIU=${FILTER(0-9+,${CUT(ARS_X,:,2)})})
 same => n,Set(ARS_FRM=${PJSIP_HEADER(read,From)})
 same => n,Set(ARS_X=${CUT(ARS_FRM,@,1)})
 same => n,Set(ARS_FRMU=${FILTER(0-9+,${CUT(ARS_X,:,2)})})
 same => n,Set(ARS_SRC=num)
 same => n,GotoIf($[${LEN(${ARS_CID})} >= 10]?cidok)
 same => n,Set(ARS_CID=${ARS_PAIU})
 same => n,Set(ARS_SRC=pai)
 same => n,GotoIf($[${LEN(${ARS_CID})} >= 10]?cidok)
 same => n,Set(ARS_CID=${ARS_FRMU})
 same => n,Set(ARS_SRC=from)
 same => n(cidok),Log(NOTICE,ARS2FA cid uid=${UNIQUEID} src=${ARS_SRC} numlen=${LEN(${CALLERID(num)})} pailen=${LEN(${ARS_PAIU})} fromlen=${LEN(${ARS_FRMU})} used=${ARS_CID:0:3}****${ARS_CID:-4})
 same => n,Set(ARS_PAI=)
 same => n,Set(ARS_FRM=)
 same => n,Set(ARS_X=)
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=3)
 ; is any authentication waiting for a call on this 070? if not, this call is not part of an authentication
 same => n,Set(ARS_PRE=${CURL(http://127.0.0.1:3000/internal/pbx/precheck,rn=${URIENCODE(${ARS_RN})}&uid=${UNIQUEID}&caller=${URIENCODE(${ARS_CID})}&key=__INTERNAL_API_KEY__)})
 same => n,Answer()
 same => n,Wait(0.3)
 same => n,GotoIf($["${ARS_PRE}" != "OK"]?invalid)
 ; common greeting while the carrier AuthLog arrives (usually 1-2 s after the call starts)
 same => n,Playback(custom/ars2fa-greet)
 ; identify the session from the carrier AuthLog; passing calls switch the 0507 forwarding off right away.
 ; Not there yet: "please wait" and ask again (3 times), then a last check that may fail with no_authlog.
 same => n,Set(ARS_TRY=0)
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n(con),Set(ARS_CON=${CURL(http://127.0.0.1:3000/internal/pbx/connect,rn=${URIENCODE(${ARS_RN})}&caller=${URIENCODE(${ARS_CID})}&uid=${UNIQUEID}&t0=${ARS_T0}&wait=1&key=__INTERNAL_API_KEY__)})
 same => n,GotoIf($["${ARS_CON}" != "WAIT"]?conok)
 same => n,Set(ARS_TRY=$[${ARS_TRY} + 1])
 same => n,GotoIf($[${ARS_TRY} >= 3]?conlast)
 same => n,Playback(custom/ars2fa-wait)
 same => n,Goto(con)
 same => n(conlast),Set(CURLOPT(httptimeout)=12)
 same => n,Set(ARS_CON=${CURL(http://127.0.0.1:3000/internal/pbx/connect,rn=${URIENCODE(${ARS_RN})}&caller=${URIENCODE(${ARS_CID})}&uid=${UNIQUEID}&t0=${ARS_T0}&key=__INTERNAL_API_KEY__)})
 same => n(conok),NoOp(connect try=${ARS_TRY})
 same => n,Log(NOTICE,ARS2FA uid=${UNIQUEID} rn=${ARS_RN} connect=${ARS_CON})
 same => n,GotoIf($["${ARS_CON}" = "APP"]?app)
 same => n,GotoIf($["${ARS_CON}" = "APPN"]?appn)
 same => n,GotoIf($["${ARS_CON:0:3}" = "PC:"]?pc)
 same => n,Set(ARS_RES=${ARS_CON})
 same => n,Goto(fail)
 ; APP type 1: "to authenticate press 1" (the greeting was already played)
 same => n(app),Read(ARS_KEY,custom/ars2fa-notice,1,,1,6)
 same => n,Goto(appv)
 ; APP type 0 (no press-1): decide right away; own completed / failed messages
 same => n(appn),Set(ARS_KEY=)
 same => n,Set(ARS_OKP=custom/ars2fa-ok0)
 same => n,Set(ARS_FAILP=custom/ars2fa-fail0)
 same => n(appv),Set(CURLOPT(httptimeout)=25)
 same => n,Set(ARS_RES=${CURL(http://127.0.0.1:3000/internal/pbx/verify,rn=${URIENCODE(${ARS_RN})}&caller=${URIENCODE(${ARS_CID})}&uid=${UNIQUEID}&t0=${ARS_T0}&confirm=${URIENCODE(${ARS_KEY})}&key=__INTERNAL_API_KEY__)})
 same => n,Log(NOTICE,ARS2FA uid=${UNIQUEID} rn=${ARS_RN} confirm=${ARS_KEY} result=${ARS_RES})
 same => n,GotoIf($["${ARS_RES}" = "OK"]?ok)
 ; no authentication behind this call (no carrier record / no waiting session / wrong line)
 same => n(fail),GotoIf($["${ARS_RES}" = "FAIL:no_session"]?invalid)
 same => n,GotoIf($["${ARS_RES}" = "FAIL:no_authlog"]?invalid)
 same => n,GotoIf($["${ARS_RES}" = "FAIL:pool_mismatch"]?invalid)
 same => n,GotoIf($["${ARS_RES}" = ""]?invalid)
 same => n,Playback(${ARS_FAILP})
 same => n,Hangup()
 same => n(invalid),Log(NOTICE,ARS2FA uid=${UNIQUEID} rn=${ARS_RN} invalid-access pre=${ARS_PRE} result=${ARS_RES})
 same => n,Playback(custom/ars2fa-invalid)
 same => n,Hangup()
 same => n(ok),Playback(${ARS_OKP})
 same => n,Hangup()
 ; PC: the PC now shows the code; the caller keys it in (digits also accepted while the guidance plays)
 same => n(pc),Set(ARS_DIG=${CUT(ARS_CON,:,2)})
 same => n,Set(ARS_RTO=${CUT(ARS_CON,:,3)})
 same => n,Read(ARS_CODE,custom/ars2fa-pc-guide,${ARS_DIG},,1,${ARS_RTO})
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(ARS_RES=${CURL(http://127.0.0.1:3000/internal/pbx/code,uid=${UNIQUEID}&code=${ARS_CODE}&key=__INTERNAL_API_KEY__)})
 same => n,Log(NOTICE,ARS2FA uid=${UNIQUEID} rn=${ARS_RN} pc-code-len=${LEN(${ARS_CODE})} result=${ARS_RES})
 same => n,GotoIf($["${ARS_RES}" = "OK"]?ok)
 same => n,GotoIf($["${ARS_RES}" = "FAIL:code_timeout"]?tmo)
 same => n,Goto(fail)
 same => n(tmo),Playback(custom/ars2fa-timeout)
 same => n,Hangup()
exten => _X!,1,Set(__ARS_DID=${EXTEN})
 same => n,Goto(s,1)
exten => _+X!,1,Set(__ARS_DID=${EXTEN})
 same => n,Goto(s,1)
; call over: the backend switches the number's CallMix forwarding off right away
exten => h,1,Set(CURLOPT(conntimeout)=1)
 same => n,Set(CURLOPT(httptimeout)=2)
 same => n,Set(ARS_H=${CURL(http://127.0.0.1:3000/internal/pbx/hangup,uid=${UNIQUEID}&key=__INTERNAL_API_KEY__)})

